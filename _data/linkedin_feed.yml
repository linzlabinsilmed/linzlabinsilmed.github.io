- title: >-
    🌟 WCE2026 🌟 


    Our colleague Argyrios Petras is currently in Florida, attending the 6th
    World Congress on Electroporation and Pulsed Electric Fields in Biology,
    Medicine and Food & Environmental Technologies ⚡️ The conference covers all
    aspects of electroporation and pulsed electric field technologies, spanning
    applications in biology, medicine, food, and environmental technologies.
    Among the many topics discussed, pulsed field ablation (PFA) for cardiac
    applications 🫀 is one area of interest. 


    🎤 Yesterday, @Argyrios presented, on behalf of Luca Pasini, their work
    entitled: “Impact of Contact Force and Electrode Configuration on Electric
    Field Distribution in Focal Pulsed Field Ablation: a Computational Study on
    a Realistic Porcine Geometry.” This work would not have been possible
    without our collaborators, namely Gerard Amorós Figueras, Zoraida Moreno
    Weidmann, David Viladés Medel, Aurel Neic, Edward Vigmond, Antoni Ivorra,
    Jose M Guerra and Luca Gerardo-Giorda. 


    💡 If you didn't get a chance to attend the talk but are interested in PFA
    and computational modelling, Argyrios Petras will be at the conference until
    the end. Feel free to get in touch with him! 


    🙏 Thank you to the organizers and International Society for
    Electroporation-Based Technologies and Treatments (ISEBTT) for a great
    conference!


