- title: >-
    🎉 Welcome, Simon Bihoreau, to the Linz Lab for In-Silico Medical
    Interventions! 🎉


    We are very happy to welcome postdoctoral researcher Simon Bihoreau, who
    joined our team today! 👋 


    Simon studied engineering at ENSTA Paris before moving to Bordeaux, where he
    completed his Master’s and PhD at Inria in March 2026. During his PhD, he
    developed a mathematical model of pulsed-field ablation (PFA), using a
    multiscale approach to connect cellular-level mechanisms with tissue-scale
    behavior. 


    As part of our lab, he will work on the development and numerical
    implementation of multiscale, time-dependent PFA models, incorporating
    additional physical mechanisms such as lipid oxidation and its effects
    across different timescales. 


    Outside of work, he enjoys running, climbing, history, web development, and
    video games. 🏃♂️🧗♂️📚🎮 


    We are very happy to have Simon Bihoreau on board and look forward to the
    exciting research and collaborations ahead! 🚀 


    Welcome to the team, Simon!🎉


