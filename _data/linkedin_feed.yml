- title: >-
    🇸🇮 EBTT2026 in Ljubljana! 


    Our group, represented by Luca Pasini and Argyrios Petras, participated in
    the 20th International Scientific Workshop & Postgraduate Course on
    Electroporation-Based Technologies and Treatments (#EBTT2026), held from 9
    to 14 November 2026 in Ljubljana, Slovenia. 


    🎤 Our PhD student Luca Pasini attended the entire workshop, learning about
    the latest scientific advances in electroporation-based technologies, and
    exchanging ideas and experiences with leading international experts in the
    field. Moreover, he presented his work where he explored how does the
    placement of return electrodes influence pulsed field ablation. 


    💡One of the workshop highlights was the round-table discussion “Cardiac
    Pulsed Field Ablation – Reality Check”, where Argyrios Petras was an invited
    panelist, and actively contributed to discussions about the current
    challenges and future developments of this promising technology. 


    We would like to express our sincere gratitude to Damijan Miklavčič, Saša
    Haberl Meglič and the entire organising team at the University of Ljubljana,
    Faculty of Electrical Engineering, as well as the Institute of Oncology
    Ljubljana, for organising this excellent scientific event! 🤝 


