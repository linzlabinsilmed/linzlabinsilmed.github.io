- title: >-
    🎓 Huge congratulations to our colleague Minha Anees, who has just earned
    her PhD! 🎉👏 


    Under the supervision of Argyrios Petras and Luca Gerardo-Giorda, Minha
    successfully defended her dissertation entitled “Patient specific modelling
    of cardiac RFA procedure” 🫀 💻 


    Her thesis focuses on the use of patient-specific computational modelling to
    better understand and improve cardiac radiofrequency ablation (RFA). By
    analysing the impact of patient anatomy, electrode and patch placement, and
    differences in tissue properties, her work provides valuable insights into
    treatment effectiveness and procedural safety, with the aim of supporting
    more personalised ablation strategies in the future. 


    Congratulations, Minha Anees, on completing your thesis! Wishing you all the
    best for the future 🌟


