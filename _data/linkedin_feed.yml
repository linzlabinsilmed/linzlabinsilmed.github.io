- title: >-
    #VPH2026! 🎉 


    Last Friday, our colleague Davide Baroli presented the outcomes of his work
    at #VPH2026 🎤 


    He introduced a thermo-poro-elastic framework that integrates tissue
    deformation, interstitial fluid transport, and heat transfer using patient
    geometries, with potential applications of electroporation in skin cancer
    and low-grade glioma 💻 


    This work represents an important step towards connecting computational
    modelling and clinical oncology 🏥🎯 


    Congratulations to Davide Baroli and his co-authors, Argyrios Petras and
    Luca Gerardo-Giorda! 🎉


    And thank you to the VPH - The Society for In Silico Medicine for a great
    conference!🫶


