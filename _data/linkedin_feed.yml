- title: >-
    ⚡🫀Sharing our research on PFA in New York! 


    Our group leader, Luca Gerardo-Giorda, was invited to serve as faculty at
    PFA 101: From Bench to Bedside, a pre-conference event of the VT Symposium
    that provided a comprehensive overview of PFA from different perspectives
    across multiple sessions. 


    In his talk, “Radiofrequency and Pulsed Field Ablation – Lessons Learned,”
    Luca shared the new insights on the stacking of PFA and RFA energy that he
    and Argyrios Petras identified through computational modeling 💻 🫀 in
    collaboration with our colleagues Damijan Miklavčič and Bor Kos from
    University of Ljubljana.


    We are proud to contribute to this exciting field and to be part of the
    ongoing efforts to advance computational modelling for cardiac ablation! 🚀 


    We thank Damijan Miklavčič , Atul Verma, M.D., Francis Marchlinski, Vivek
    Reddy (https://lnkd.in/dw23CwY5), and everyone involved in organizing the
    event for the opportunity, the excellent program, and the many insightful
    discussions! 👏 


    We’re already looking forward to the next edition of PFA 101: From Bench to
    Bedside! 


    PFA 101: https://lnkd.in/dCyc4pDU


