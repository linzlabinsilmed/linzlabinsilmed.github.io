- title: >-
    🫀 New publication in Scientific Reports! 


    Every patient is different, yet cardiac ablation procedures often rely on
    the same general approach. Could patient characteristics such as BMI and sex
    influence how energy is delivered during radiofrequency ablation (RFA)? 


    Minha Anees and our colleagues investigated this question using 8
    patient-specific virtual models and performing 136 simulations 💻 to study
    how factors as sex and BMI affect electrical conditions during high-power
    RFA. 


    The results show that higher BMI is associated with higher baseline
    impedance, which may influence energy delivery and lesion formation.
    Furthermore, differences between male and female anatomies were observed
    although these differences were not statistically significant. Together,
    these findings suggest that a one-size-fits-all approach may not fully
    account for patient-specific factors that influence cardiac ablation,
    highlighting the importance of considering patient variability when
    optimizing treatment strategies. 


    Computational modelling can help us better understand these differences and,
    in the future, support more personalized cardiac ablation. 🫀⚡ 


    Congratulations to Minha Anees, Zoraida Moreno Weidmann, David Viladés
    Medel, Aurel Neic, Edward Vigmond, Jose M Guerra, Luca Gerardo-Giorda and
    Argyrios Petras! 👏 


    🔗 Read the full paper: https://lnkd.in/dz8phEpq 


