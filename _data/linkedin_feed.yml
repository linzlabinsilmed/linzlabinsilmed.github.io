- title: >-
    News from VPH2026! 🎉 


    Our colleague Argyrios Petras just presented the outcomes of his work,
    “In-Silico Assessment of Contact Force Effects in Cardiac Catheter
    Ablation,” at #VPH2026 organized by VPH - The Society for In Silico Medicine
    in Milan. 


    His work shows that contact force influences lesion formation in both RFA
    and PFA, although its effects differ between the two techniques. These
    findings highlight the importance of contact force in better understanding
    and optimizing cardiac ablation procedures🫀 


    Congratulations to Argyrios and his co-authors Luca Pasini, Minha Anees,
    Zoraida Moreno Weidmann, David Viladés Medel, Aurel Neic, Edward
    Vigmond,Jose M Guerra and Luca Gerardo-Giorda! 👏 


    One more talk from our lab coming up at #VPH2026 this Friday! 💻🧠 


    Link to the abstract: https://lnkd.in/dAj7tHWj
