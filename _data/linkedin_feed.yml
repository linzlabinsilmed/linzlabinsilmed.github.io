- title: >-
    🌟 ECMTB 2026 🌟 


    Our team represented by Argyrios Petras, Davide Baroli, and Luca
    Gerardo-Giorda joined researchers from around the world at the 14th European
    Conference on Mathematical & Theoretical Biology (#ECMTB2026), hosted by the
    University of Graz 🇦🇹. It was an inspiring week of sharing ideas, building
    connections, and exploring how mathematics, engineering, and biology can
    come together to address complex challenges. 


    💻❤️ Argyrios Petras presented a multiscale computer model that simulates
    how pulsed field ablation (PFA) affects heart tissue over time, helping
    improve treatments for cardiac arrhythmias. 


    ⚡🎯 Davide Baroli introduced a physics-based model that captures how
    electrical pulses, heat, and tissue interact during irreversible
    electroporation (IRE), with the goal of making melanoma treatments more
    precise and effective. 


    🫀🏥 Luca Gerardo-Giorda presented an advanced PFA model that accurately
    predicts the size and shape of treatment lesions in the heart by accounting
    for heart muscle fiber orientation and changes in tissue properties,
    bringing simulations closer to real clinical outcomes. 


    Events like #ECMTB2026 highlight the power of interdisciplinary research,
    and we are already looking forward to the next edition at #ECMTB2028 🚀! 


    ECMBT website: https://ecmtb2026.org/ 

