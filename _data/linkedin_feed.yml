- title: >-
    🎓 Sharing our research at the PhD Seminar Series! 


    Our PhD students Matteo Micocci and Luca Pasini recently presented their
    research at the PhD Seminar Series. The seminar brings together PhD students
    from the Johann Radon Institute for Computational and Applied Mathematics
    (RICAM) of the Austrian Academy of Sciences - Österreichische Akademie der
    Wissenschaften (ÖAW) and Johannes Kepler Universität Linz (JKU). 


    The seminar takes place during both the winter and summer semesters, with
    different focuses: 


    ❄️ Winter semester: Providing a platform for PhD students to present their
    research and exchange ideas. 

    ☀️ Summer semester: Supporting the development of scientific, technical and
    soft skills through talks and workshops led by invited experts. 


    In this winter semester’s edition, Matteo Micocci presented his work
    entitled “A Patient-Specific CFD Pipeline with Polynomial Chaos Expansion
    for Uncertainty Quantification of Pressure Drop and Haemodynamic Biomarkers
    in Aortic Coarctation.” His research investigates how uncertainties in
    patient-specific data and model parameters can influence predictions of
    pressure drop and other important haemodynamic biomarkers in aortic
    coarctation. 


    Luca Pasini presented his work in a talk entitled “From CT Scan to Virtual
    Treatments: Mathematical Modelling of Cardiac Pulsed Field Ablation.” He
    explored how mathematical modelling can support the investigation of pulsed
    field ablation (PFA), from developing a virtual pig torso based on computed
    tomography (CT) images to modelling the treatment and predicting lesion
    formation. 💻🫀 


    The seminar series is organized by our colleagues Argyrios Petras from Linz
    Lab for In-Silico Medical Interventions and Sumaia Saad Eddin

    from JKU. A big thank you to them for creating this opportunity for
    scientific exchange! 🤝 


    Congratulations to Matteo and Luca on presenting their research! We wish
    them all the best and continued success in their PhD journeys! 🚀 


    PhD Seminar Series website: https://lnkd.in/dt6jwQZc


