- title: >-
    🌟 Mini-symposium at the CMBE 🌟


    🎉 We are happy to announce that our mini-symposium MS9: 𝗗𝗶𝗴𝗶𝘁𝗮𝗹
    𝗧𝘄𝗶𝗻𝘀 𝗳𝗼𝗿 𝗖𝗶𝗿𝗰𝘂𝗹𝗮𝘁𝗼𝗿𝘆 𝗜𝗻𝘁𝗲𝗿𝘃𝗲𝗻𝘁𝗶𝗼𝗻𝘀 𝗮𝗻𝗱
    𝗦𝘂𝗽𝗽𝗼𝗿𝘁 has been accepted for the CMBE: Computational and
    Mathematical Biomedical Engineering - International Conference Series! The
    conference will take place in Groningen, the Netherlands, in June 2027.


    💡 Organized by our colleagues Beata Ondrusova, Argyrios Petras, Davide
    Baroli, and Luca Gerardo-Giorda, this mini-symposium will bring together
    researchers working on computational blood flow modeling in cardiovascular
    interventions and circulatory support. 🫀 The focus will be on advancing
    patient-specific simulations and digital twins to better understand blood
    flow, assess patient–device interactions, predict potential complications,
    and improve the design and performance of cardiovascular devices and support
    more personalized treatment strategies. 


    🔬 Are you working in this field or interested in contributing? We warmly
    invite you to contribute your work and join the discussion! Know someone who
    might be interested? Please share this announcement with them! 😊 


    📅 𝗜𝗺𝗽𝗼𝗿𝘁𝗮𝗻𝘁 𝗱𝗮𝘁𝗲𝘀:  

    - Abstract submission deadline: 11 February 2027 

    - Conference: 21–23 June 2027 

    - Location: University of Groningen, The Netherlands 


    𝗖𝗼𝗻𝗳𝗲𝗿𝗲𝗻𝗰𝗲 𝘄𝗲𝗯𝘀𝗶𝘁𝗲: https://lnkd.in/epWXEeuQ 

