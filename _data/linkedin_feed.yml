- title: >-
    🔬🎓 Our research at the 10th Kepler Science Day! 


    Our group was represented at the 10th Kepler Science, organised by Johannes
    Kepler Universität Linz. The event brings together researchers from across
    Upper Austria, providing a great opportunity to present their work, exchange
    ideas and make new connections. 🤝 


    We are particularly proud of the contributions of our early-career
    researchers: 


    💻 Aldo Karamani, our Master's student, presented SegmentX, a pipeline for
    comprehensive, single-step cardiac segmentation. We are excited to share
    more about this tool soon! 

    📊 Matteo Micocci, our PhD student, gave an oral presentation on the results
    of his Master's research on uncertainty quantification in aortic
    coarctation.

    🫀 Minha Anees, our postdoctoral researcher, presented a poster on
    patient-specific modelling of cardiac radiofrequency ablation, showing how
    virtual patient models can help investigate this treatment more
    effectively. 


    A big thank you to Aldo, Matteo and Minha for presenting their research, and
    to the organisers for creating such a nice opportunity for scientific
    exchange! 🚀 


    #KeplerScience #JKULinz #Research #InSilicoMedicine #ComputationalModelling
    #UncertaintyQuantification #CardiacModelling #CardiacAblation
    #MedicalImaging
