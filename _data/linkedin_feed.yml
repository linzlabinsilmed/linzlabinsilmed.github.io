- title: >-
    We are Linz Lab for In-Silico Medical Interventions but what comes to mind
    when you hear “in-silico”? 🤔 


    In-silico medicine means using mathematical models and computer simulations
    to better understand and personalise medical interventions. 💻🩺


    In our lab, we develop patient-specific computational models for ablation
    therapies 🫀, study the efficacy of extracorporeal life support 🫁,
    investigate the progression of tumors such as gliomas 🧠, and explore many
    other applications to deliver accurate and reliable in silico tools in
    medicine. 


    Our goal? Better predictions, better interventions, and more personalised
    care 🎯


    💡 Do you have a research idea, clinical problem, modelling challenge, or
    potential collaboration in mind? We'd love to hear from you! Reach out to
    our postdoctoral researches Argyrios Petras, Beata Ondrusova or Davide
    Baroli or contact our group leader Luca Gerardo-Giorda 📨 


