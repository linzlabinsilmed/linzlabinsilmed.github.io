- title: >-
    🤝🔬 A week of scientific exchange and new collaborations! 


    Last week, we were delighted to host Irina Pettersson, Associate Professor
    and Head of the Unit of Applied Mathematics and Statistics at Chalmers
    University of Technology in Sweden. 


    Her research focuses on mathematical analysis and modelling, particularly
    homogenization, differential equations and their applications to biological
    systems. 


    During her visit, Irina gave an insightful talk on her latest research in
    electroporation, a topic closely connected to our lab's work. ⚡ The visit
    provided an excellent opportunity to exchange ideas, discuss common research
    interests and explore possibilities for future collaboration. 


    We are excited about the opportunities ahead and look forward to continuing
    this exchange! 


    Thank you, Irina, for visiting us! 🚀 


